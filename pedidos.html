<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos y ventas — Corazón Artesano</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body data-titulo="Pedidos y ventas" data-sub="Cada pedido se registra a nombre de la artesana que elaboró la pieza">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <div class="app-content">

        <div class="card" style="display:flex;gap:20px;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap">
          <span class="kpi-ico green" style="width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--green-100);color:var(--green-600);flex:0 0 auto">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:27px;height:27px"><path d="M12 20s-7-4.6-9.2-9C1.3 8 3 5 6.3 5c2 0 3.4 1 5.7 3.5C14.3 6 15.7 5 17.7 5c3.3 0 5 3 3.5 6-2.2 4.4-9.2 9-9.2 9z"/></svg>
          </span>
          <div style="flex:1;min-width:240px">
            <h3 style="margin-bottom:4px">Ventas directas</h3>
            <p class="small">Las ventas se realizan desde el canal colectivo de la cooperativa: el comprador adquiere directamente a la artesana y se reduce la dependencia de intermediarios. Cada pedido registrado aquí es una venta simulada del prototipo.</p>
          </div>
          <div class="summary-chips" style="margin:0" id="resumen-ventas"></div>
        </div>

        <div class="admin-toolbar">
          <div class="search-box">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="search" id="buscar" placeholder="Buscar por pedido, cliente o producto…" aria-label="Buscar pedidos">
          </div>
          <select id="filtro-estado" aria-label="Filtrar por estado">
            <option value="todos">Todos los estados</option>
            <option value="Pendiente">Pendiente</option>
            <option value="En preparación">En preparación</option>
            <option value="Enviado">Enviado</option>
            <option value="Entregado">Entregado</option>
          </select>
          <select id="filtro-mes" aria-label="Filtrar por mes">
            <option value="todos">Todos los meses</option>
          </select>
          <button type="button" class="btn btn-outline" id="limpiar">Limpiar</button>
        </div>

        <div class="summary-chips" id="resumen-estados"></div>

        <div id="tabla-pedidos"></div>

        <div class="load-more-wrap">
          <button type="button" class="btn btn-outline" id="mas" style="display:none">Cargar más pedidos</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/pedidos.js"></script>
</body>
</html>
