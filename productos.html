<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de productos — Corazón Artesano</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body data-titulo="Gestión de productos" data-sub="Catálogo colectivo: agrega, edita y administra la disponibilidad de cada pieza">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <div class="app-content">

        <div class="admin-toolbar">
          <div class="search-box">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="search" id="buscar" placeholder="Buscar por nombre, artesana o material…" aria-label="Buscar productos">
          </div>
          <select id="filtro-cat" aria-label="Filtrar por categoría">
            <option value="todas">Todas las categorías</option>
          </select>
          <select id="filtro-disp" aria-label="Filtrar por disponibilidad">
            <option value="todos">Todos los estados</option>
            <option value="disponibles">Solo disponibles</option>
            <option value="agotados">Solo agotados</option>
          </select>
          <button type="button" class="btn btn-primary" id="btn-nuevo">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            Nuevo producto
          </button>
        </div>

        <div class="summary-chips" id="resumen"></div>

        <div id="tabla-productos"></div>

        <div class="load-more-wrap">
          <button type="button" class="btn btn-outline" id="mas" style="display:none">Cargar más productos</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/productos.js"></script>
</body>
</html>
